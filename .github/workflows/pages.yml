name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Rewrite root-absolute paths for the /portfolio subpath
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/site/
          find /tmp/site -name '*.html' -print0 | xargs -0 sed -i \
            -E 's/(href|src)="\/(([^/][^"]*)?)"/\1="\/portfolio\/\2"/g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '/tmp/site'
      - id: deployment
        uses: actions/deploy-pages@v4
